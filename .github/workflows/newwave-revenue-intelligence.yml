name: New Wave Revenue Intelligence tests

on:
  pull_request:
    paths:
      - "newwave-revenue-intelligence/**"
      - ".github/workflows/newwave-revenue-intelligence.yml"
  push:
    branches: [main]
    paths:
      - "newwave-revenue-intelligence/**"
      - ".github/workflows/newwave-revenue-intelligence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newwave-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: newwave-revenue-intelligence
    env:
      # Tests use synthetic fixtures and temporary workspaces only; AI is never called.
      NWRI_AI_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: newwave-revenue-intelligence/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -ra
