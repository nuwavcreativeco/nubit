# Local-only dashboard. Do not change the address to 0.0.0.0.
[server]
address = "127.0.0.1"
port = 8501
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 200
fileWatcherType = "none"

[browser]
gatherUsageStats = false
serverAddress = "127.0.0.1"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[theme]
base = "dark"
primaryColor = "#8B7CF6"
backgroundColor = "#0F1117"
secondaryBackgroundColor = "#181B25"
textColor = "#E6E8EF"
font = "sans serif"
